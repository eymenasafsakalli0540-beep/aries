<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARİES AI — Kontrol Paneli</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b24;
      --line: #2a2f3d;
      --text: #eef1f7;
      --muted: #9aa4b8;
      --accent: #6ee7b7;
      --danger: #ff7a7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input {
      flex: 1 1 240px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #10131a;
      color: var(--text);
      font-size: 15px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0b1220;
      background: var(--accent);
    }
    button.secondary { background: #394156; color: var(--text); }
    button.danger { background: var(--danger); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      min-height: 180px;
      max-height: 420px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .status { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .status.error { color: var(--danger); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>ARİES AI — Kontrol Paneli</h1>
  <p class="sub">Loglar, bakım modu ve ajan durumu. Şifre sadece bu sayfada kullanılır, saklanmaz.</p>

  <div class="card">
    <div class="row">
      <input id="pw" type="password" placeholder="Panel şifresi" autocomplete="off">
      <button id="statusBtn" data-action="status">Durum</button>
      <button id="logsBtn" data-action="get">Logları göster</button>
    </div>
    <div class="status" id="status">Hazır.</div>
  </div>

  <div class="card">
    <div class="grid">
      <button class="secondary" data-action="maintenance">Bakım modunu aç</button>
      <button class="secondary" data-action="resume">Bakım modundan çık</button>
      <button class="danger" data-action="clear">Logları temizle</button>
      <button class="secondary" id="chatBtn">ARIES sohbeti</button>
    </div>
  </div>

  <div class="card">
    <pre id="output">Sonuç burada görünecek.</pre>
  </div>
</div>

<script>
  const pw = document.getElementById('pw');
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  document.getElementById('chatBtn').onclick = () => { location.href = '/'; };

  async function call(action) {
    const password = pw.value;
    if (!password) {
      status.textContent = 'Lütfen panel şifresini gir.';
      status.className = 'status error';
      return;
    }
    status.textContent = 'İstek gönderiliyor...';
    status.className = 'status';
    try {
      const res = await fetch('/api/get-logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, action })
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok || data.success === false) {
        status.textContent = data.message || ('Hata: HTTP ' + res.status);
        status.className = 'status error';
        output.textContent = JSON.stringify(data, null, 2);
        return;
      }
      status.textContent = 'İşlem tamam.';
      if (Array.isArray(data.logs)) {
        output.textContent = data.logs.join('\n');
      } else {
        output.textContent = JSON.stringify(data, null, 2);
      }
    } catch (err) {
      status.textContent = 'Bağlantı hatası: ' + err.message;
      status.className = 'status error';
    }
  }

  document.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => call(btn.dataset.action));
  });
</script>
</body>
</html>
